<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/web115/images/jackal-logos/Jackal Logos-cropped (5).svg"">
    <link rel=" preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Tomorrow&display=swap"
        rel="stylesheet">
    <title>Home ※ JackalGaming</title>

    <style>
        .quicksand-uniquifier {
            font-family: "Quicksand", sans-serif;
            font-optical-sizing: auto;
            font-weight: 300;
            font-style: normal;
        }

        :root {
            --jade: #00a87c;
        }

        html,
        body {
height: 100%;
            font-family: "Quicksand";
            background-color: #383838;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .front-card {
            background-color: var(--jade);
            display: block;
            color: #fff;
            box-sizing: border-box;
            padding: 3vw;
            margin: 20px;
            width: 7in;
            height: 4in;
            border: 1 solid #000;
            box-shadow: 0 0 15px 10px #000000a8;
            justify-content: center;
            align-items: center;


        }

        .black-logo {
            display: flex;
            align-items: center;
            margin-left: .5in;
            position: absolute;
            z-index: 1;

        }

        .company-name {
            font-size: 36px;
            display: flex;
            justify-content: center;
            margin-top: .6in;
            margin-left: 1.75in;
            position: absolute;
            z-index: 2;
        }

        .tagline {
            font-size: 20px;
            display: flex;
            justify-content: center;
            margin-top: .9in;
            margin-left: 2in;
            position: absolute;
            text-align: center;
            z-index: 2;
        }

        .back-card {
            background-color: #fff;
            display: flex;
            color: var(--jade);
            box-sizing: border-box;
            padding: 3vw;
            margin: 20px;
            width: 7in;
            height: 4in;
            border: 1 solid #000;
            box-shadow: 0 0 15px 10px #000000a8;
            justify-content: center;
            align-items: center;
        }

        .green-logo {
            display: flex;
            align-items: center;
        }

        .separator {
            border-left: 2px solid var(--jade);
            margin: 0 .25in;
            height: 3in;
        }
    </style>
</head>

<body>

    <div class="front-card">
        <div class="card-content">
            <img class="black-logo" src="/web115/images/jackal-logos/Jacksl Logos-cropped (3).svg"
                alt="JackalGaming logo in black with a transparent jackal">
            <p class="company-name">Jackal Gaming LLC</p>
            <div class="tagline">
                <p>RETRO GAMING<br>FOR THE<br>MODERN WORLD<br>MODIFICATIONS / REPAIRS</p>
            </div>
        </div>
    </div>
    <div class="back-card">
        <div class="logo">
            <img class="green-logo" src="/web115/images/jackal-logos/Jackal Logos-cropped (5).svg"
                alt="JackalGaming logo in green iwht a transparent jackal">
        </div>
        <div class="separator"></div>
        <div class="contact-info">
            <p>David James</p>
            <p><strong>Owner</strong></p>
            <p>1201 Elizabeth Ave,<br>Charlotte, NC 28204</p>
            <p>djames26@email.cpcc.edu</p>
            <p>djamescpcc.github.io</p>
            <p>704-280-0128</p>
        </div>
    </div>


</body>

</html>
